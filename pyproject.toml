[project]
name = "postgres-benchmark"
version = "0.1.0"
description = "PostgreSQL equality-query benchmark: PK vs pk_clone (no index) vs pk_clone (indexed)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
benchmark = "benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

